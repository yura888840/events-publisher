services:
  api:
    build:
      context: .
      target: runtime

    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"

    env_file:
      - .env

    init: true
    restart: unless-stopped
    stop_grace_period: 20s

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/', { signal: AbortSignal.timeout(2000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
